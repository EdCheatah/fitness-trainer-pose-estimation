<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrainer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ── Sidebar ────────────────────────────────────── -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="9" width="4" height="6" rx="1"/>
                <rect x="18" y="9" width="4" height="6" rx="1"/>
                <rect x="6" y="7" width="2" height="10" rx="1"/>
                <rect x="16" y="7" width="2" height="10" rx="1"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <span>FitTrainer</span>
        </div>

        <nav class="sidebar-nav">
            <!-- <a href="/video_analysis" class="sidebar-link nav-link">Video Analysis</a> -->
            <a href="/dashboard" class="sidebar-link nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6"  y1="20" x2="6"  y2="14"/>
                </svg>
                Dashboard
            </a>
        </nav>

        <div class="sidebar-divider"></div>

        <!-- Exercise picker -->
        <div class="sidebar-section">
            <div class="section-header">
                <span class="section-title">Exercise</span>
                <span id="exercise-count" class="exercise-count"></span>
            </div>

            <div class="category-tabs">
                <button class="category-tab active" data-category="all">All</button>
                <button class="category-tab" data-category="upper">Upper</button>
                <button class="category-tab" data-category="lower">Lower</button>
                <button class="category-tab" data-category="cardio">Cardio</button>
            </div>

            <div class="exercise-options" id="exercise-grid">
                <div class="loading">Loading...</div>
            </div>

            <div id="exercise-info" class="exercise-info hidden">
                <div class="info-header">
                    <span id="info-name" class="info-name"></span>
                    <span id="info-type" class="info-type"></span>
                </div>
                <p id="info-description" class="info-description"></p>
                <div id="info-note" class="info-note"></div>
            </div>
        </div>

    </aside>

    <!-- ── Main ──────────────────────────────────────── -->
    <main class="main">

        <!-- Stats bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Exercise</div>
                <div id="current-exercise" class="stat-value">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Set</div>
                <div id="current-set" class="stat-value">0 / 0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Reps</div>
                <div id="current-reps" class="stat-value">0 / 0</div>
            </div>
            <div class="stat-card stat-accent">
                <div class="stat-label">Form Score</div>
                <div id="form-score" class="stat-value form-score">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Grade</div>
                <div id="form-grade" class="stat-value form-grade">—</div>
            </div>
        </div>

        <!-- Camera feed -->
        <div class="video-container">
            <div id="video-placeholder" class="video-placeholder">
                <div class="placeholder-content">
                    <div class="placeholder-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.82v6.36a1 1 0 0 1-1.447.888L15 14"/>
                            <rect x="3" y="8" width="12" height="8" rx="2"/>
                        </svg>
                    </div>
                    <p>Ready to track your workout</p>
                    <button id="start-camera-btn" class="btn primary-btn">Activate Camera</button>
                </div>
            </div>
            <img id="video" src="" alt="Fitness Tracker Video Feed" style="display: none;">
            <button id="fullscreen-btn" class="fullscreen-btn" style="display:none" title="Fullscreen">&#x26F6;</button>
        </div>

        <!-- Bottom config + actions -->
        <div class="bottom-bar">
            <div class="config-inputs">
                <div class="input-group">
                    <label for="sets">Sets</label>
                    <input type="number" id="sets" min="1" max="10" value="3">
                </div>
                <div class="input-group">
                    <label for="reps">Reps</label>
                    <input type="number" id="reps" min="1" max="30" value="10">
                </div>
            </div>
            <div class="action-buttons">
                <button id="start-btn" class="btn primary-btn">Start Workout</button>
                <button id="stop-btn" class="btn secondary-btn" disabled>Stop</button>
            </div>
        </div>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
