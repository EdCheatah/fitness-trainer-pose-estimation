# Bicep Curl Exercise Definition
name: bicep_curl
display_name: "Bicep Curl"
type: repetition
bilateral: true

# Meta information
target_muscles:
  - Biceps
  - Brachialis
equipment: "Dumbbells"
difficulty: beginner
default_reps: 10
default_sets: 3
rest_time: "60 seconds"
benefits:
  - "Builds bicep strength"
  - "Improves arm definition"
description: "Classic bicep curl with controlled tempo"

# Angle definitions
angles:
  left:
    points: [left_shoulder, left_elbow, left_wrist]
    description: "Left arm elbow angle"

  right:
    points: [right_shoulder, right_elbow, right_wrist]
    description: "Right arm elbow angle"

# State machine
state_order:
  - flex
  - curl
  - down

states:
  down:
    condition: "angle > 150"
    description: "Arm extended - starting position"

  curl:
    condition: "angle > 50 and angle <= 150"
    description: "Curling phase"

  flex:
    condition: "angle <= 50"
    description: "Top position - counter increments"

# Counter rule
counter:
  trigger_state: flex
  from_state: curl

# Time filter
min_rep_duration: 0.8

# Form feedback rules
feedback:
  partial_rep:
    condition: "state == 'flex' and angle > 40"
    message: "Squeeze more at the top!"
    severity: info

# Calibration
calibration:
  enabled: true
  reps: 2

# Visualization
visualization:
  lines:
    - points: [left_shoulder, left_elbow]
      color: [0, 0, 255]
      thickness: 4
    - points: [left_elbow, left_wrist]
      color: [0, 0, 255]
      thickness: 4
    - points: [right_shoulder, right_elbow]
      color: [102, 0, 0]
      thickness: 4
    - points: [right_elbow, right_wrist]
      color: [102, 0, 0]
      thickness: 4
